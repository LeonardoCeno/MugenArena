name: mugenarena-dev

services:
  php:
    image: php:8.4-cli
    working_dir: /app
    volumes:
      - .:/app
    command: php -S 0.0.0.0:8080
    ports:
      - "8080:8080"

  vite:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - vite_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - php
    environment:
      - VITE_PHP_PROXY=http://php:8080

volumes:
  vite_modules:
